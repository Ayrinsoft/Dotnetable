<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Dotnetable documentation — Admin panel and public API." />
  <title>Dotnetable Docs</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/docs.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">D</div>
        <div class="brand-text">
          <strong data-i18n="brand">Dotnetable Docs</strong>
          <span id="brandSub" data-i18n="brand.sub">Admin</span>
        </div>
      </div>

      <div class="book-switch" role="group" aria-label="Documentation area">
        <button type="button" class="book-btn active" data-book="admin" id="bookAdmin">
          <span data-i18n="book.admin">Admin</span>
        </button>
        <button type="button" class="book-btn" data-book="api" id="bookApi">
          <span data-i18n="book.api">API</span>
        </button>
      </div>

      <div class="sidebar-tools">
        <label class="search-wrap">
          <span class="sr-only" data-i18n="search">Search</span>
          <input type="search" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="Search…" autocomplete="off" />
        </label>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="fa" id="langFa">FA</button>
          <button type="button" class="lang-btn" data-lang="en" id="langEn">EN</button>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Documentation"></nav>

      <div class="sidebar-footer">
        <p data-i18n="footer.hint">Update matching pages when Admin or API behavior changes.</p>
        <code>src/Dotnetable.Docs</code>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menuToggle" aria-label="Menu">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="admin-link" id="pathBadge" hidden title="">
          <span id="pathBadgeLabel" data-i18n="path.admin">Path</span>
          <code id="pathBadgeCode"></code>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <div class="loading" data-i18n="loading">Loading…</div>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <script src="js/catalog-admin.js" charset="utf-8"></script>
  <script src="js/catalog-api.js" charset="utf-8"></script>
  <script src="js/app.js" charset="utf-8"></script>
</body>
</html>
