<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Dotnetable Admin documentation — bilingual FA/EN guide for every admin panel feature." />
  <title>Dotnetable Admin Docs</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/docs.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">D</div>
        <div class="brand-text">
          <strong data-i18n="brand">Dotnetable Docs</strong>
          <span data-i18n="brand.sub">Admin guide</span>
        </div>
      </div>

      <div class="sidebar-tools">
        <label class="search-wrap">
          <span class="sr-only" data-i18n="search">Search</span>
          <input type="search" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="Search docs…" autocomplete="off" />
        </label>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="fa" id="langFa">FA</button>
          <button type="button" class="lang-btn" data-lang="en" id="langEn">EN</button>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Documentation"></nav>

      <div class="sidebar-footer">
        <p data-i18n="footer.hint">Keep this site in sync when Admin pages change.</p>
        <code>src/Dotnetable.Admin.Docs</code>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menuToggle" aria-label="Menu">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="admin-link" id="adminPathLink" hidden title="">
          <span data-i18n="open.admin">Admin path</span>
          <code id="adminPathCode"></code>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <div class="loading" data-i18n="loading">Loading…</div>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
